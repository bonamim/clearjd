<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<!--
  Source for assets/logo.png and assets/logo-avatar.png.

  The "JD" is cream with a heavy dark outline painted behind the glyphs, so a
  single transparent file stays legible on any background: the outline gives
  it presence on white, and on a dark ground the outline disappears into it
  and the letters simply read as cream.

  The stroke weight is a balance. Too thin and the letters go hollow on
  white, reading as an outline rather than a wordmark; too thick and it looks
  like a sticker. 0.12em is enough to define the edge without drawing
  attention to itself.

  Regenerate after editing:

    CHROME="/Applications/Google Chrome.app/Contents/MacOS/Google Chrome"
    "$CHROME" --headless --disable-gpu --hide-scrollbars \
      --screenshot=assets/logo.png --window-size=880,260 \
      --default-background-color=00000000 --virtual-time-budget=6000 \
      "file://$PWD/tools/logo.html"
    "$CHROME" --headless --disable-gpu --hide-scrollbars \
      --screenshot=assets/logo-avatar.png --window-size=800,800 \
      --default-background-color=0E141B --virtual-time-budget=6000 \
      "file://$PWD/tools/logo.html?variant=avatar"

  Rendered at 2x and displayed at 330px, so it stays crisp on retina.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box; margin:0;}
  html,body{width:880px; height:260px; overflow:hidden; background:transparent;}
  body{
    display:grid;
    place-items:center;
    font-family:'Space Grotesk', sans-serif;
    font-weight:700;
  }
  .logo{
    display:flex;
    align-items:center;
    gap:6px;
    font-size:104px;
    letter-spacing:-0.02em;
    color:#F3F1EA;
  }
  .jd{
    -webkit-text-stroke:0.12em #0E141B;
    paint-order:stroke fill;
  }
  .mark{
    background:#FFD400;
    color:#0E141B;
    padding:2px 26px 8px;
    border-radius:14px;
    transform:rotate(-2deg);
    display:inline-block;
    margin-right:10px;
  }

  /* Square profile picture, where the background is ours to set and the crop
     is a circle or a square rather than a wide strip. */
  body[data-variant="avatar"]{width:800px; height:800px; background:#0E141B;}
  body[data-variant="avatar"] .logo{flex-direction:column; gap:0; font-size:150px;}
  body[data-variant="avatar"] .mark{margin:0 0 6px; padding:4px 30px 12px;}
</style>
</head>
<body>
  <div class="logo"><span class="mark">Clear</span><span class="jd">JD</span></div>
  <script>
    // ?variant=avatar renders the square profile picture.
    const variant = new URL(location.href).searchParams.get('variant');
    if(variant) document.body.dataset.variant = variant;
  </script>
</body>
</html>
