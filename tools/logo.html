<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">
<style>
  /* Rendered at 2x (880x260) and displayed at 440px wide, so it stays crisp
     on retina screens. The dark ground is baked in so the logo reads the
     same on GitHub's light and dark themes. */
  *{box-sizing:border-box; margin:0;}
  html,body{width:880px; height:260px; overflow:hidden;}
  body{
    background:#0E141B;
    display:grid;
    place-items:center;
    font-family:'Space Grotesk', sans-serif;
    font-weight:700;
  }
  .logo{
    display:flex;
    align-items:center;
    gap:6px;
    font-size:104px;
    letter-spacing:-0.02em;
    color:#F3F1EA;
  }
  .mark{
    background:#FFD400;
    color:#0E141B;
    padding:2px 26px 8px;
    border-radius:14px;
    transform:rotate(-2deg);
    display:inline-block;
    margin-right:10px;
  }
</style>
</head>
<body>
  <div class="logo"><span class="mark">Clear</span>JD</div>
</body>
</html>
