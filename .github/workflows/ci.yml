name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Lint and test
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # The two Node versions still in support. Testing both is what makes
        # the "Node 22 or newer" line in CONTRIBUTING.md a fact rather than a
        # hope. Node 20 is deliberately absent: it went end-of-life in
        # April 2026.
        node: ['22', '24']

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}

      # There is nothing to install. The project has no dependencies, and the
      # checks use only what Node ships with.
      - name: Lint
        run: npm run lint

      - name: Test
        run: node --test tests/*.test.js

      # The files in examples/ are generated from assets/examples.js. This
      # catches a pull request that edits one by hand, or that changes the
      # data without regenerating.
      - name: Check the generated examples are committed
        run: |
          npm run examples
          if ! git diff --quiet -- examples/; then
            echo "::error::examples/ is out of date. Run 'npm run examples' and commit the result."
            git diff -- examples/
            exit 1
          fi
